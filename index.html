<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Surprise For Titi 💙</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Stars Container -->
  <div id="stars-container" aria-hidden="true"></div>

  <!-- Main Content Wrapper -->
  <main class="page-container">
    
    <!-- Header Badge & Title -->
    <div class="welcome-card">
      <span class="badge">✨ Something Special ✨</span>
      <h1 class="main-title">For Titi 💙</h1>
      <p class="subtitle">A little journey made with love, just for your special day.</p>
    </div>

    <!-- Animated Floating Heart Icon -->
    <div class="heart-icon-wrapper">
      <div class="glowing-heart">💙</div>
    </div>

    <!-- Start Button -->
    <div class="button-wrapper">
      <button id="startBtn" class="start-btn">
        Begin the Surprise 🎈
      </button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
